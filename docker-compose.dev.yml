services:
  # PostgreSQL with pgvector extension
  db:
    image: ankane/pgvector:latest
    container_name: phd-practice-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-testamentary-traces}
    # SECURITY: Do NOT expose database port - only accessible within Docker network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - epistemic-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama local inference runtime for active Turin analysis
  ollama:
    image: ollama/ollama:latest
    container_name: phd-practice-ollama-dev
    volumes:
      - ollama_data_dev:/root/.ollama
    networks:
      - epistemic-network-dev

  # FastAPI Backend with hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phd-practice-backend-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-testamentary-traces}
      TURIN_MODEL: ${TURIN_MODEL:-qwen3:8b-q4_K_M}
      TURIN_RUNTIME_VERSION: ${TURIN_RUNTIME_VERSION:-turin-runtime-v2}
      TURIN_QWEN_NUM_CTX: ${TURIN_QWEN_NUM_CTX:-16384}
      TURIN_QWEN_SOURCE_ANALYSIS_MAX_TOKENS: ${TURIN_QWEN_SOURCE_ANALYSIS_MAX_TOKENS:-1000}
      TURIN_QWEN_CROSS_SOURCE_MAX_TOKENS: ${TURIN_QWEN_CROSS_SOURCE_MAX_TOKENS:-1000}
      TURIN_QWEN_FINAL_SYNTHESIS_MAX_TOKENS: ${TURIN_QWEN_FINAL_SYNTHESIS_MAX_TOKENS:-768}
      TURIN_QWEN_TEMPERATURE: ${TURIN_QWEN_TEMPERATURE:-0.2}
      TURIN_MAX_INPUT_TOKENS: ${TURIN_MAX_INPUT_TOKENS:-12000}
      TURIN_TIMEOUT_SECONDS: ${TURIN_TIMEOUT_SECONDS:-180}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount source code for hot reload
      - ./backend/app:/app/app:ro
      - backend_logs:/app/logs
      - model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - epistemic-network-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend with Vite dev server and HMR
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: phd-practice-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      # Mount source for hot module replacement
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/tests:/app/tests:ro
      - ./docs/turin_experiment:/docs/turin_experiment:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.js:/app/vite.config.js:ro
      # Don't mount node_modules (use container's version)
      - /app/node_modules
    networks:
      - epistemic-network-dev
    environment:
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}

networks:
  epistemic-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
  backend_logs:
  model_cache:
  ollama_data_dev:
