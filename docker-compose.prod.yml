version: '3.9'

services:
  # PostgreSQL with pgvector extension
  db:
    image: ankane/pgvector:latest
    container_name: phd-practice-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-testamentary-traces}
    # SECURITY: Do NOT expose database port to internet - only accessible within Docker network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - phd-practice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: innovation-design-backend
    container_name: phd-practice-backend
    ports:
      - "8000:8000"  # expose backend for host nginx
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-testamentary-traces}
      TURIN_RUNTIME_VERSION: ${TURIN_RUNTIME_VERSION:-turin-runtime-v2}
      TURIN_INFERENCE_PROVIDER: ${TURIN_INFERENCE_PROVIDER:-disabled}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:15435}
      TURIN_MODEL: ${TURIN_MODEL:-qwen3:8b-q4_K_M}
      TURIN_QWEN_NUM_CTX: ${TURIN_QWEN_NUM_CTX:-16384}
      TURIN_QWEN_FINAL_SYNTHESIS_MAX_TOKENS: ${TURIN_QWEN_FINAL_SYNTHESIS_MAX_TOKENS:-1200}
      TURIN_QWEN_TEMPERATURE: ${TURIN_QWEN_TEMPERATURE:-0.2}
      TURIN_DEDICATED_QWEN_ENDPOINT: ${TURIN_DEDICATED_QWEN_ENDPOINT:-}
      TURIN_DEDICATED_QWEN_MODEL: ${TURIN_DEDICATED_QWEN_MODEL:-}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # Auth0 Configuration
      AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-dev-i4m880asz7y6j5sk.us.auth0.com}
      AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-https://api.ddrarchive.org}
    # SECURITY: Backend only accessible via nginx proxy, not directly from internet
    # ports:
    #   - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - model_cache:/root/.cache/huggingface
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - phd-practice-network
    extra_hosts:
      - "host.docker.internal:172.19.0.1"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    restart: unless-stopped

  docling-worker:
    image: innovation-design-backend
    profiles: ["docling"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-testamentary-traces}
      DOCLING_ENABLE_OCR: "false"
      DOCLING_MAX_THREADS: "1"
      DOCLING_ARTIFACTS_PATH: /root/.cache/docling
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - model_cache:/root/.cache/huggingface
      - docling_cache:/root/.cache/docling
    networks:
      - phd-practice-network
    mem_limit: 6g
    mem_reservation: 4g
    cpus: 2.0

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: phd-practice-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - phd-practice-network
    restart: unless-stopped

networks:
  phd-practice-network:
    external: true
    name: ai-methods_epistemic-network

volumes:
  postgres_data:
  backend_logs:
  model_cache:
  docling_cache:
