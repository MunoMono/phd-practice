version: '3.9'

services:
  # PostgreSQL with pgvector extension
  db:
    image: ankane/pgvector:latest
    container_name: phd-practice-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-testamentary-traces}
    # SECURITY: Do NOT expose database port - only accessible within Docker network
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - phd-practice-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local Ollama inference runtime. The backend reaches this service by name.
  ollama:
    image: ollama/ollama:latest
    container_name: innovation-design-ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - phd-practice-network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: phd-practice-backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-testamentary-traces}
      TURIN_INFERENCE_PROVIDER: ${TURIN_INFERENCE_PROVIDER:-disabled}
      TURIN_MODEL: ${TURIN_MODEL:-qwen3:8b-q4_K_M}
      TURIN_RUNTIME_VERSION: ${TURIN_RUNTIME_VERSION:-turin-runtime-v2}
      TURIN_QWEN_NUM_CTX: ${TURIN_QWEN_NUM_CTX:-16384}
      TURIN_QWEN_SOURCE_ANALYSIS_MAX_TOKENS: ${TURIN_QWEN_SOURCE_ANALYSIS_MAX_TOKENS:-1000}
      TURIN_QWEN_CROSS_SOURCE_MAX_TOKENS: ${TURIN_QWEN_CROSS_SOURCE_MAX_TOKENS:-1000}
      TURIN_QWEN_FINAL_SYNTHESIS_MAX_TOKENS: ${TURIN_QWEN_FINAL_SYNTHESIS_MAX_TOKENS:-768}
      TURIN_QWEN_TEMPERATURE: ${TURIN_QWEN_TEMPERATURE:-0.2}
      TURIN_MAX_INPUT_TOKENS: ${TURIN_MAX_INPUT_TOKENS:-12000}
      TURIN_TIMEOUT_SECONDS: ${TURIN_TIMEOUT_SECONDS:-45}
      GIT_COMMIT: ${GIT_COMMIT:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      S3_BUCKET: ${S3_BUCKET}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - model_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - phd-practice-network
    restart: unless-stopped

  # Profile-only, single-document worker for controlled Turin Docling ingestion.
  # It is run explicitly and does not start with the application stack.
  docling-worker:
    image: innovation-design-backend
    profiles: ["docling"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-testamentary-traces}
      DOCLING_ENABLE_OCR: "false"
      DOCLING_MAX_THREADS: "1"
      DOCLING_ARTIFACTS_PATH: /root/.cache/docling
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
      - model_cache:/root/.cache/huggingface
      - docling_cache:/root/.cache/docling
    networks:
      - phd-practice-network
    mem_limit: 6g
    mem_reservation: 4g
    cpus: 2.0

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: phd-practice-frontend
    ports:
      - "8080:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - phd-practice-network
    restart: unless-stopped

  # MinIO (S3-compatible storage) - Optional
  minio:
    image: minio/minio:latest
    container_name: phd-practice-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - phd-practice-network
    restart: unless-stopped

networks:
  phd-practice-network:
    driver: bridge

volumes:
  postgres_data:
  backend_logs:
  model_cache:
  docling_cache:
  minio_data:
  ollama_data:
    external: true
    name: innovation-design_ollama_data_dev
